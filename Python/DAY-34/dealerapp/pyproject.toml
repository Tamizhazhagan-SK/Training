[project]
name = "bmw-dealer-inventory-api"
version = "1.0.0"
description = "FastAPI + PostgreSQL API for managing BMW dealer vehicle inventories."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "BMW Trainee" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "controllers",
    "services",
    "repositories",
    "models",
    "dtos",
    "configurations",
]
