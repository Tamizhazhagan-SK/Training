[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample_app"
version = "1.0.0"
description = "Sample Python Application"
requires-python = ">=3.10"

dependencies = [
  "pytest>=7.0.0",
  "Faker>=18.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
